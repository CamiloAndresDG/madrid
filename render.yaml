# Blueprint de Render: https://render.com/docs/blueprint-spec
# La base de datos vive en Supabase (Postgres), así que el servicio no necesita disco y cabe en el plan gratuito.
services:
  - type: web
    name: futbol7-gmadrid
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/rules
    envVars:
      - key: NODE_VERSION
        value: 22.15.0
      - key: DATABASE_URL
        sync: false  # cadena del "Session pooler" de Supabase; se pone en el panel de Render
      - key: COORDINATOR_EMAIL
        sync: false  # email que obtiene el rol de coordinador al registrarse (el primer coordinador)
