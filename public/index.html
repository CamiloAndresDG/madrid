<!doctype html>

  <script>
    // Modo claro/oscuro: se aplica antes de pintar para evitar parpadeos
    (function () {
      try {
        var t = localStorage.getItem('f7_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">

  <header class="topbar">

    </a>
    <nav id="nav" class="nav" aria-label="Secciones"></nav>
    <div class="topbar-actions">
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Cambiar a modo oscuro" title="Modo claro / oscuro">
        <svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg>
      </button>
      <a id="logoutLink" class="icon-btn" href="#/salir" aria-label="Cerrar sesión" title="Cerrar sesión" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg>

  </header>
  <div class="pride-band" aria-hidden="true"></div>
  <main id="app" class="container"><p class="muted">Cargando…</p></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
